name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls /Applications | grep -i xcode || true
          sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Unit tests (simulator)
        run: |
          set -o pipefail
          DEST=$(xcrun simctl list devices available | grep -E "iPhone (1[5-9]|2[0-9])" | head -1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          echo "Simulator: $DEST"
          xcodebuild test \
            -project BookOn.xcodeproj \
            -scheme BookOn \
            -destination "id=$DEST" \
            -derivedDataPath build-test \
            CODE_SIGNING_ALLOWED=NO \
            | tee test.log | grep -E "error:|Test Case|Executed|BUILD|TEST" || true
          grep -qE "\*\* TEST SUCCEEDED \*\*" test.log

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project BookOn.xcodeproj \
            -scheme BookOn \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee build.log | grep -E "error:|warning: |BUILD" || true
          test -d build/Build/Products/Release-iphoneos/BookOn.app

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/BookOn.app Payload/
          zip -qry BookOn.ipa Payload
          ls -lh BookOn.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BookOn-ipa
          path: BookOn.ipa

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            test.log

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: BookOn build ${{ github.run_number }}
          body: "未签名 IPA，需用 AltStore / Sideloadly / 巨魔 等自签安装。commit: ${{ github.sha }}"
          files: BookOn.ipa
          prerelease: true
